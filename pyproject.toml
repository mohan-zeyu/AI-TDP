[project]
name = "tdp"
version = "0.2.0"
description = "Physics-constrained reconstruction of chip temperature fields from sparse trusted sensors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepxde>=1.15.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
    "torch>=2.11.0",
]

[project.optional-dependencies]
deploy = ["onnx>=1.16", "onnxruntime>=1.18"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdp"]

[tool.uv]
package = true
