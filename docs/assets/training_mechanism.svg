<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="mgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <radialGradient id="h1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <g id="lock">
      <rect x="0" y="5" width="14" height="11" rx="2" fill="#475569"/>
      <path d="M 3 5 V 3 a 4 4 0 0 1 8 0 V 5" fill="none" stroke="#475569" stroke-width="2.2"/>
    </g>
  </defs>
  <rect width="1400" height="1020" fill="#ffffff"/>

  <!-- legend -->
  <rect x="20" y="38" width="18" height="14" fill="#ffedd5" stroke="#ea580c"/><text x="44" y="50" font-size="12" fill="#334155">trainable weights</text>
  <rect x="185" y="38" width="18" height="14" fill="#e2e8f0" stroke="#64748b"/><use href="#lock" transform="translate(207,39) scale(0.8)"/><text x="228" y="50" font-size="12" fill="#334155">frozen (copied)</text>
  <rect x="360" y="38" width="18" height="14" fill="#dbeafe" stroke="#2563eb"/><text x="384" y="50" font-size="12" fill="#334155">simulated data</text>
  <rect x="510" y="38" width="18" height="14" fill="#dcfce7" stroke="#16a34a"/><text x="534" y="50" font-size="12" fill="#334155">measured data (Pi 4B)</text>
  <line x1="700" y1="45" x2="740" y2="45" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/><text x="748" y="50" font-size="12" fill="#334155">gradients</text>

  <!-- ================= PANEL 1: PRETRAIN ================= -->
  <text x="20" y="122" font-size="17" font-weight="bold" fill="#0f172a">① Pre-training — the operator learns heat physics from unlimited simulated boards</text>

  <!-- FDM simulator: vertical block at far left -->
  <rect x="20" y="165" width="112" height="170" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="76" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">FDM</text>
  <text x="76" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">simulator</text>
  <text x="76" y="258" text-anchor="middle" font-size="11" fill="#1e3a8a">one board,</text>
  <text x="76" y="274" text-anchor="middle" font-size="11" fill="#1e3a8a">same layout,</text>
  <text x="76" y="290" text-anchor="middle" font-size="11" fill="#1e3a8a">two states</text>

  <!-- states stacked, fed by horizontal arrows -->
  <rect x="172" y="165" width="130" height="78" rx="6" fill="#fffbeb" stroke="#2563eb" stroke-width="1.4"/>
  <ellipse cx="212" cy="208" rx="20" ry="12" fill="url(#h2)"/><ellipse cx="262" cy="222" rx="12" ry="8" fill="url(#h1)" opacity="0.6"/>
  <text x="237" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">state A</text>
  <rect x="172" y="257" width="130" height="78" rx="6" fill="#fffbeb" stroke="#2563eb" stroke-width="2.2"/>
  <ellipse cx="215" cy="302" rx="22" ry="13" fill="url(#h1)"/><ellipse cx="262" cy="315" rx="12" ry="8" fill="url(#h2)" opacity="0.6"/>
  <text x="237" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">state B = target</text>
  <line x1="132" y1="204" x2="172" y2="204" stroke="#334155" stroke-width="1.6" marker-end="url(#ma)"/>
  <line x1="132" y1="296" x2="172" y2="296" stroke="#334155" stroke-width="1.6" marker-end="url(#ma)"/>

  <!-- backbone chain (trainable) -->
  <rect x="340" y="185" width="146" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="413" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Point encoder</text>
  <text x="413" y="236" text-anchor="middle" font-size="12" fill="#7c2d12">Fourier + MLP</text>
  <text x="413" y="253" text-anchor="middle" font-size="11" fill="#7c2d12">(shared for all points)</text>

  <rect x="518" y="185" width="124" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="580" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Token set</text>
  <text x="580" y="236" text-anchor="middle" font-size="11" fill="#7c2d12">sensors · context</text>
  <text x="580" y="252" text-anchor="middle" font-size="11" fill="#7c2d12">· cond token</text>

  <rect x="674" y="185" width="124" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="736" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Self-Attn</text>
  <text x="736" y="242" text-anchor="middle" font-size="12" fill="#7c2d12">× 2</text>

  <rect x="830" y="185" width="124" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="892" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Cross-Attn × 3</text>
  <text x="892" y="236" text-anchor="middle" font-size="11" fill="#7c2d12">queries read</text>
  <text x="892" y="252" text-anchor="middle" font-size="11" fill="#7c2d12">the token set</text>

  <rect x="986" y="185" width="110" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1041" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Head</text>
  <text x="1041" y="242" text-anchor="middle" font-size="12" fill="#7c2d12">→ θ̂(x, y)</text>

  <line x1="486" y1="230" x2="518" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>
  <line x1="642" y1="230" x2="674" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>
  <line x1="798" y1="230" x2="830" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>
  <line x1="954" y1="230" x2="986" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>

  <!-- states into encoder: horizontal / elbow, no crossings -->
  <line x1="302" y1="204" x2="340" y2="204" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mb)"/>
  <text x="344" y="177" font-size="11" fill="#2563eb">context points (x, y, θ)</text>
  <path d="M 302 296 L 321 296 L 321 252 L 340 252" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mb)"/>
  <text x="330" y="292" font-size="11" fill="#2563eb">K sensors</text>

  <!-- queries into cross-attn -->
  <text x="892" y="322" text-anchor="middle" font-size="12" fill="#334155">query coordinates (x, y) — anywhere</text>
  <line x1="892" y1="308" x2="892" y2="275" stroke="#334155" stroke-width="1.6" marker-end="url(#ma)"/>

  <!-- loss: rightmost, terminates the left-to-right flow -->
  <rect x="1150" y="185" width="200" height="100" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="1250" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Loss</text>
  <text x="1250" y="232" text-anchor="middle" font-size="12" fill="#713f12">match true field (MSE)</text>
  <text x="1250" y="250" text-anchor="middle" font-size="12" fill="#713f12">+ heat-equation residual</text>
  <text x="1250" y="268" text-anchor="middle" font-size="11" fill="#713f12">∇²θ̂ − ĥθ̂ + Q̂ = 0 ?</text>
  <line x1="1096" y1="230" x2="1150" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>

  <!-- true field to loss (orthogonal) -->
  <path d="M 237 335 L 237 480 L 1320 480 L 1320 289" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mb)"/>
  <text x="660" y="473" text-anchor="middle" font-size="11" fill="#2563eb">true temperatures of state B (known — it is simulated)</text>

  <!-- gradients back into every block -->
  <path d="M 1200 285 L 1200 398 L 380 398" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3"/>
  <line x1="413" y1="398" x2="413" y2="278" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/>
  <line x1="580" y1="398" x2="580" y2="278" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/>
  <line x1="736" y1="398" x2="736" y2="278" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/>
  <line x1="866" y1="398" x2="866" y2="278" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/>
  <line x1="1041" y1="398" x2="1041" y2="278" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/>
  <text x="660" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">gradients update ALL weights (1.06 M)</text>

  <!-- ================= COPY ARROW ================= -->
  <path d="M 700 508 L 700 560" fill="none" stroke="#64748b" stroke-width="6" marker-end="url(#mg)"/>
  <text x="716" y="540" font-size="14" font-weight="bold" fill="#475569">copy all weights → freeze</text>

  <!-- ================= PANEL 2: FINE-TUNE ================= -->
  <text x="20" y="596" font-size="17" font-weight="bold" fill="#0f172a">② Board-card fine-tuning — the frozen operator meets one real board (Raspberry Pi)</text>

  <!-- real source -->
  <rect x="20" y="620" width="250" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="145" y="643" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Measured IR frames</text>
  <text x="145" y="659" text-anchor="middle" font-size="12" fill="#14532d">cropped board, trusted (taped) pixels</text>

  <rect x="60" y="690" width="170" height="115" rx="6" fill="#fffbeb" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="125" cy="755" rx="26" ry="17" fill="url(#h1)"/>
  <rect x="98" y="728" width="60" height="52" fill="#1f2937" opacity="0.25" rx="3"/>
  <text x="145" y="708" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">real thermal frame</text>
  <text x="145" y="795" text-anchor="middle" font-size="10" fill="#14532d">dark = tape (trusted)</text>
  <line x1="145" y1="666" x2="145" y2="690" stroke="#334155" stroke-width="1.2" marker-end="url(#ma)"/>

  <!-- frozen backbone chain -->
  <rect x="330" y="640" width="140" height="90" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <use href="#lock" transform="translate(448,648)"/>
  <text x="400" y="676" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Point encoder</text>
  <text x="400" y="696" text-anchor="middle" font-size="12" fill="#475569">same weights</text>

  <!-- token set: two compartments -->
  <rect x="500" y="640" width="170" height="90" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <use href="#lock" transform="translate(648,648)"/>
  <text x="585" y="664" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Token set</text>
  <text x="577" y="682" text-anchor="middle" font-size="11" fill="#475569">sensor tokens (from encoder)</text>
  <line x1="504" y1="692" x2="666" y2="692" stroke="#64748b" stroke-width="1"/>
  <!-- plug-in strip: 8 board-token cells + cond cell -->
  <g stroke="#ea580c" stroke-width="1.2" fill="#ffedd5">
    <rect x="512" y="700" width="13" height="22"/><rect x="527" y="700" width="13" height="22"/>
    <rect x="542" y="700" width="13" height="22"/><rect x="557" y="700" width="13" height="22"/>
    <rect x="572" y="700" width="13" height="22"/><rect x="587" y="700" width="13" height="22"/>
    <rect x="602" y="700" width="13" height="22"/><rect x="617" y="700" width="13" height="22"/>
    <rect x="638" y="700" width="22" height="22"/>
  </g>
  <text x="649" y="715" text-anchor="middle" font-size="9" fill="#7c2d12">ĥγ</text>

  <rect x="700" y="640" width="120" height="90" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <use href="#lock" transform="translate(798,648)"/>
  <text x="760" y="677" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Self-Attn</text>
  <text x="760" y="697" text-anchor="middle" font-size="12" fill="#475569">× 2</text>

  <rect x="850" y="640" width="120" height="90" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <use href="#lock" transform="translate(948,648)"/>
  <text x="910" y="677" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Cross-Attn × 3</text>

  <rect x="1000" y="640" width="96" height="90" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <use href="#lock" transform="translate(1074,648)"/>
  <text x="1048" y="677" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Head</text>
  <text x="1048" y="697" text-anchor="middle" font-size="12" fill="#475569">→ θ̂(x, y)</text>

  <line x1="470" y1="685" x2="500" y2="685" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>
  <line x1="670" y1="685" x2="700" y2="685" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>
  <line x1="820" y1="685" x2="850" y2="685" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>
  <line x1="970" y1="685" x2="1000" y2="685" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>

  <!-- real data into encoder: horizontal -->
  <line x1="230" y1="700" x2="330" y2="700" stroke="#16a34a" stroke-width="1.6" marker-end="url(#mgr)"/>
  <text x="262" y="691" text-anchor="middle" font-size="11" fill="#16a34a">K tape-site readings</text>

  <!-- NEW trainables: vertical plugs into the strip -->
  <rect x="500" y="780" width="140" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/>
  <text x="570" y="802" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">board tokens × 8</text>
  <text x="570" y="820" text-anchor="middle" font-size="11" fill="#7c2d12">NEW · this board's identity</text>
  <line x1="570" y1="780" x2="570" y2="726" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ma)"/>

  <rect x="589" y="862" width="124" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/>
  <text x="651" y="884" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">ĥ, γ scalars</text>
  <text x="651" y="902" text-anchor="middle" font-size="11" fill="#7c2d12">NEW · board physics</text>
  <line x1="651" y1="862" x2="651" y2="726" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ma)"/>

  <!-- queries -->
  <text x="910" y="775" text-anchor="middle" font-size="12" fill="#334155">query coordinates (x, y)</text>
  <line x1="910" y1="762" x2="910" y2="730" stroke="#334155" stroke-width="1.6" marker-end="url(#ma)"/>

  <!-- loss: rightmost, terminates the left-to-right flow -->
  <rect x="1150" y="640" width="200" height="96" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="1250" y="668" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Loss</text>
  <text x="1250" y="690" text-anchor="middle" font-size="12" fill="#713f12">match IR at trusted pixels</text>
  <text x="1250" y="708" text-anchor="middle" font-size="11" fill="#713f12">(held-out patches excluded)</text>
  <line x1="1096" y1="685" x2="1150" y2="685" stroke="#334155" stroke-width="1.8" marker-end="url(#ma)"/>

  <!-- gradients: square, upright, from below — no crossings -->
  <path d="M 1200 736 L 1200 930 L 570 930 L 570 832" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/>
  <path d="M 651 930 L 651 914" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#mr)"/>
  <text x="895" y="922" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">gradients touch ONLY the orange — 1,026 params, ~1 min</text>

  <!-- trusted pixels to loss (orthogonal) -->
  <path d="M 145 805 L 145 950 L 1320 950 L 1320 740" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#mgr)"/>
  <text x="500" y="943" text-anchor="middle" font-size="11" fill="#16a34a">measured temperatures at trusted pixels (the "answer sheet")</text>

  <!-- board card output -->
  <text x="20" y="995" font-size="13" font-weight="bold" fill="#4c1d95">→ result: a "board card" = {8 tokens, ĥ, γ} · a few KB per board · swap the card to swap the board · the backbone is never touched again</text>
</svg>
