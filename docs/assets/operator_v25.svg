<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1080" height="680" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">ThermalOperator v2.5 — forward pass</text>

  <!-- ============ INPUT BOXES ============ -->
  <rect x="20" y="66" width="212" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="126" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Live sensors  (B, K, 3)</text>
  <text x="126" y="107" text-anchor="middle" font-size="12" fill="#1e3a8a">(x, y, θ/s) · K = 2…16</text>

  <rect x="20" y="146" width="212" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="126" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Context frame A  (B, M1, 3)</text>
  <text x="126" y="187" text-anchor="middle" font-size="12" fill="#14532d">(x, y, θ_ref / s_ctx) · optional</text>

  <rect x="20" y="226" width="212" height="56" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="126" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">Context frame B  (B, M2, 3)</text>
  <text x="126" y="267" text-anchor="middle" font-size="12" fill="#134e4a">second reference state · optional</text>

  <rect x="20" y="306" width="212" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="126" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Condition vector  (B, 4)</text>
  <text x="126" y="347" text-anchor="middle" font-size="12" fill="#7c2d12">[ln ĥ/3, ln γ/3, aspect, BC]</text>

  <rect x="20" y="486" width="212" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="126" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Query coords  (B, Q, 2)</text>
  <text x="126" y="527" text-anchor="middle" font-size="12" fill="#4c1d95">any points, any resolution</text>

  <!-- ============ ENCODERS ============ -->
  <rect x="292" y="140" width="206" height="92" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">SensorEncoder (shared)</text>
  <text x="395" y="183" text-anchor="middle" font-size="12" fill="#334155">Fourier (x,y): 2 → 64  ⊕  θ</text>
  <text x="395" y="201" text-anchor="middle" font-size="12" fill="#334155">MLP 65 → 128 → 128 · GELU</text>
  <text x="395" y="222" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">same weights for sensors &amp; context</text>

  <rect x="292" y="306" width="206" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="329" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">cond_embed</text>
  <text x="395" y="348" text-anchor="middle" font-size="12" fill="#334155">Linear 4 → 128</text>

  <rect x="292" y="478" width="206" height="72" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="501" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">QueryEncoder</text>
  <text x="395" y="520" text-anchor="middle" font-size="12" fill="#334155">Fourier 2 → 64</text>
  <text x="395" y="537" text-anchor="middle" font-size="12" fill="#334155">MLP 64 → 128 → 128 · GELU</text>

  <!-- arrows inputs -> encoders -->
  <line x1="232" y1="94"  x2="292" y2="160" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="232" y1="174" x2="292" y2="184" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="232" y1="254" x2="292" y2="208" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="232" y1="334" x2="292" y2="334" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="232" y1="514" x2="292" y2="514" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ============ TYPE EMBEDDING CHIPS ============ -->
  <rect x="540" y="80"  width="128" height="30" rx="15" fill="#dbeafe" stroke="#2563eb"/>
  <text x="604" y="100" text-anchor="middle" font-size="12" fill="#1e3a8a">+ type e0 (sensor)</text>
  <rect x="540" y="152" width="128" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/>
  <text x="604" y="172" text-anchor="middle" font-size="12" fill="#14532d">+ type e1 (ctx A)</text>
  <rect x="540" y="224" width="128" height="30" rx="15" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="604" y="244" text-anchor="middle" font-size="12" fill="#134e4a">+ type e2 (ctx B)</text>
  <rect x="540" y="306" width="128" height="30" rx="15" fill="#ffedd5" stroke="#ea580c"/>
  <text x="604" y="326" text-anchor="middle" font-size="12" fill="#7c2d12">+ type e3 (cond)</text>

  <!-- arrows encoder -> chips -->
  <line x1="498" y1="170" x2="540" y2="95"  stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="498" y1="186" x2="540" y2="167" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="498" y1="202" x2="540" y2="239" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="498" y1="334" x2="540" y2="321" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ============ TOKEN SET ============ -->
  <rect x="716" y="66" width="188" height="200" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
  <text x="810" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Token set</text>
  <text x="810" y="108" text-anchor="middle" font-size="12" fill="#334155">(B, K + M + 1, 128)</text>
  <!-- token strip -->
  <g>
    <rect x="734" y="122" width="16" height="16" fill="#60a5fa"/><rect x="752" y="122" width="16" height="16" fill="#60a5fa"/>
    <rect x="770" y="122" width="16" height="16" fill="#60a5fa"/><rect x="788" y="122" width="16" height="16" fill="#60a5fa"/>
    <rect x="806" y="122" width="16" height="16" fill="#4ade80"/><rect x="824" y="122" width="16" height="16" fill="#4ade80"/>
    <rect x="842" y="122" width="16" height="16" fill="#2dd4bf"/><rect x="860" y="122" width="16" height="16" fill="#fb923c"/>
  </g>
  <text x="810" y="158" text-anchor="middle" font-size="11" fill="#64748b">sensors · ctx A · ctx B · cond</text>
  <text x="810" y="180" text-anchor="middle" font-size="12" fill="#334155">key-padding mask</text>
  <text x="810" y="196" text-anchor="middle" font-size="12" fill="#334155">(True = pad / dropped)</text>
  <text x="810" y="222" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">empty or fully-masked context</text>
  <text x="810" y="238" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">⇒ bit-identical to v2</text>

  <!-- chips -> token set -->
  <line x1="668" y1="95"  x2="716" y2="110" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="668" y1="167" x2="716" y2="150" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="668" y1="239" x2="716" y2="190" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="668" y1="321" x2="716" y2="230" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ============ SELF ATTENTION ============ -->
  <rect x="716" y="306" width="188" height="66" rx="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.6"/>
  <text x="810" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Self-Attention × 2</text>
  <text x="810" y="350" text-anchor="middle" font-size="12" fill="#334155">pre-norm · 4 heads · FFN 512</text>
  <line x1="810" y1="266" x2="810" y2="306" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ============ CROSS ATTENTION ============ -->
  <rect x="716" y="478" width="188" height="72" rx="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.6"/>
  <text x="810" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Cross-Attention × 3</text>
  <text x="810" y="522" text-anchor="middle" font-size="12" fill="#334155">queries attend to token set</text>
  <text x="810" y="539" text-anchor="middle" font-size="12" fill="#334155">(same padding mask)</text>

  <line x1="810" y1="372" x2="810" y2="478" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="826" y="430" font-size="12" fill="#334155">K, V</text>
  <line x1="498" y1="514" x2="716" y2="514" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="600" y="506" text-anchor="middle" font-size="12" fill="#334155">Q  (B, Q, 128)</text>

  <!-- ============ HEAD + OUTPUT ============ -->
  <rect x="944" y="478" width="120" height="72" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1004" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Head</text>
  <text x="1004" y="521" text-anchor="middle" font-size="11" fill="#334155">LN → 128 → GELU</text>
  <text x="1004" y="537" text-anchor="middle" font-size="11" fill="#334155">→ Linear → 1</text>
  <line x1="904" y1="514" x2="944" y2="514" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="944" y="586" width="120" height="48" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="1004" y="606" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">predicted θ(x, y)</text>
  <text x="1004" y="624" text-anchor="middle" font-size="12" fill="#713f12">(B, Q) · θ-units</text>
  <line x1="1004" y1="550" x2="1004" y2="586" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ============ FOOTNOTES ============ -->
  <text x="22" y="612" font-size="12" fill="#475569">d_model = 128 · 4 heads · 2 self + 3 cross blocks · ~1.06 M parameters</text>
  <text x="22" y="632" font-size="12" fill="#475569">All coordinates nondimensional: domain [0, a] × [0, 1], long side = 1 · θ = (T − T_amb) / ΔT_s</text>
  <text x="22" y="652" font-size="12" fill="#475569">Dropouts during pretraining: context 20% (keeps v2 mode alive) · condition token 30% (physics inferable from context)</text>
</svg>
