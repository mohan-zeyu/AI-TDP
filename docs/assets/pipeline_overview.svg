<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1150" height="720" fill="#ffffff"/>
  <text x="575" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">TDP pipeline — from two data streams to a deployable board card (all numbers measured)</text>

  <!-- ===== SYNTHETIC STREAM (top-left) ===== -->
  <rect x="20" y="70" width="250" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="145" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">SYNTHETIC (free, unlimited)</text>
  <text x="145" y="112" text-anchor="middle" font-size="12" fill="#1e3a8a">4096 boards × 3 operating states</text>
  <text x="145" y="129" text-anchor="middle" font-size="12" fill="#1e3a8a">FDM heat equation, nondimensional</text>
  <text x="145" y="146" text-anchor="middle" font-size="12" fill="#1e3a8a">ĥ ∈ log-U[0.3, 30] ← measured range</text>

  <rect x="330" y="70" width="250" height="90" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="455" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">Pretraining v2.5 (Colab GPU)</text>
  <text x="455" y="112" text-anchor="middle" font-size="12" fill="#312e81">in-context attention operator · 1.06M</text>
  <text x="455" y="129" text-anchor="middle" font-size="12" fill="#312e81">random-K + board-site curriculum</text>
  <text x="455" y="146" text-anchor="middle" font-size="12" fill="#312e81">MSE + self-normalized PDE (λ→1e-3)</text>
  <line x1="270" y1="115" x2="330" y2="115" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <rect x="650" y="70" width="230" height="90" rx="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="765" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Pretrained operator</text>
  <text x="765" y="117" text-anchor="middle" font-size="12" fill="#334155">context frames = board fingerprint</text>
  <text x="765" y="134" text-anchor="middle" font-size="12" fill="#334155">context gain 42–52% at every K</text>
  <text x="765" y="151" text-anchor="middle" font-size="12" fill="#334155">(cross-state, matched-K)</text>
  <line x1="580" y1="115" x2="650" y2="115" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <!-- ===== ABLATION NOTE (center) ===== -->
  <rect x="650" y="210" width="230" height="122" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="765" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">λ=0 twin ablation (same seed/data)</text>
  <text x="765" y="252" text-anchor="middle" font-size="11" fill="#475569">the physics lives in the FDM data</text>
  <text x="765" y="268" text-anchor="middle" font-size="11" fill="#475569">+ the nondimensional contract —</text>
  <text x="765" y="284" text-anchor="middle" font-size="11" fill="#475569">the residual term buys robustness</text>
  <text x="765" y="300" text-anchor="middle" font-size="11" fill="#475569">when sensors are scarce:</text>
  <text x="765" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">hotspot 4 px vs 34 px (no context)</text>
  <line x1="765" y1="160" x2="765" y2="210" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#pa)"/>

  <!-- ===== REAL STREAM (bottom) ===== -->
  <rect x="20" y="560" width="250" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="145" y="583" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">REAL (Raspberry Pi 4B, taped)</text>
  <text x="145" y="602" text-anchor="middle" font-size="12" fill="#14532d">2 IR sessions · 832 frames · 12 cases</text>
  <text x="145" y="619" text-anchor="middle" font-size="12" fill="#14532d">SoC diode log (2 s) · tape photo</text>
  <text x="145" y="636" text-anchor="middle" font-size="12" fill="#14532d">shields taped in session 2 (A/B!)</text>

  <rect x="330" y="560" width="250" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="455" y="583" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">Ingestion + QC</text>
  <text x="455" y="602" text-anchor="middle" font-size="12" fill="#064e3b">self-check 832/832 vs camera stats</text>
  <text x="455" y="619" text-anchor="middle" font-size="12" fill="#064e3b">crop 157×103 / 178×118 + registration</text>
  <text x="455" y="636" text-anchor="middle" font-size="12" fill="#064e3b">trust masks: 86–94% of pixels</text>
  <line x1="270" y1="610" x2="330" y2="610" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <rect x="640" y="560" width="230" height="100" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.6"/>
  <text x="755" y="583" text-anchor="middle" font-size="13" font-weight="bold" fill="#365314">Physics extraction</text>
  <text x="755" y="602" text-anchor="middle" font-size="12" fill="#365314">τ = 251 s, θ∞ ≈ 13 °C (two modes)</text>
  <text x="755" y="619" text-anchor="middle" font-size="12" fill="#365314">ĥ ≲ 3 (bound) · diode ≈ IR ± 1.0 °C</text>
  <text x="755" y="636" text-anchor="middle" font-size="12" fill="#365314">shield A/B: +14 °C from ε alone</text>
  <line x1="580" y1="610" x2="640" y2="610" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <!-- feedback: measured physics -> synthetic config -->
  <path d="M 700 560 L 700 470 L 90 470 L 90 165" fill="none" stroke="#65a30d" stroke-width="1.4" stroke-dasharray="6 3" marker-end="url(#pa)"/>
  <text x="395" y="462" text-anchor="middle" font-size="11" font-style="italic" fill="#65a30d">measured ĥ range + noise levels configure the simulator (M2 gates M5)</text>

  <!-- real data feeds evaluation -->
  <path d="M 870 580 L 895 580 L 895 430 L 920 430" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>
  <text x="893" y="518" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(-90 893 518)">canonical fields · sites · patches</text>

  <!-- ===== RESULTS CASCADE (right) ===== -->
  <rect x="920" y="70" width="210" height="96" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="1025" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Zero-shot (no training)</text>
  <text x="1025" y="112" text-anchor="middle" font-size="12" fill="#713f12">8 real sites + 1 reference frame</text>
  <text x="1025" y="129" text-anchor="middle" font-size="12" fill="#713f12">3.3–3.5 °C trusted RMSE</text>
  <text x="1025" y="146" text-anchor="middle" font-size="12" fill="#713f12">(RBF interpolation: 4.0–5.7 °C)</text>
  <line x1="880" y1="115" x2="920" y2="115" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <rect x="920" y="206" width="210" height="110" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="1025" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Tier-1 board card</text>
  <text x="1025" y="248" text-anchor="middle" font-size="12" fill="#713f12">+1026 params · 5.8 KB · ~1 min</text>
  <text x="1025" y="265" text-anchor="middle" font-size="12" fill="#713f12">backbone frozen, no forgetting</text>
  <text x="1025" y="282" text-anchor="middle" font-size="12" fill="#713f12">validation patches −31%</text>
  <text x="1025" y="299" text-anchor="middle" font-size="12" fill="#713f12">fitted ĥ = 0.99 (bound ≲ 3 ✓)</text>
  <line x1="1025" y1="166" x2="1025" y2="206" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <rect x="920" y="356" width="210" height="110" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="1025" y="379" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Untouched full-load tests</text>
  <text x="1025" y="398" text-anchor="middle" font-size="12" fill="#78350f">case02 (s1): 3.08 °C vs RBF 5.39</text>
  <text x="1025" y="415" text-anchor="middle" font-size="12" fill="#78350f">case06 (cross-session!):</text>
  <text x="1025" y="432" text-anchor="middle" font-size="12" fill="#78350f">3.18 °C vs RBF 5.38</text>
  <text x="1025" y="449" text-anchor="middle" font-size="12" fill="#78350f">max-T error −3.1 °C · hotspot 4.5 px</text>
  <line x1="1025" y1="316" x2="1025" y2="356" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <rect x="920" y="506" width="210" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="1025" y="529" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Deployment (M9)</text>
  <text x="1025" y="548" text-anchor="middle" font-size="12" fill="#4c1d95">on-device self-monitoring</text>
  <text x="1025" y="565" text-anchor="middle" font-size="12" fill="#4c1d95">(the Pi reads its own diode)</text>
  <text x="1025" y="582" text-anchor="middle" font-size="12" fill="#4c1d95">swap boards = swap cards</text>
  <line x1="1025" y1="466" x2="1025" y2="506" stroke="#334155" stroke-width="1.6" marker-end="url(#pa)"/>

  <!-- footnote -->
  <text x="22" y="700" font-size="12" fill="#475569">Discipline: full-load cases never trained on (severity test) · validation patches never supervised/sensed · λ grid includes 0 (physics allowed to lose) · every number regenerable from scripts/.</text>
</svg>
