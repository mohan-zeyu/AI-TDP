# Stable v3.1 continuation: lower physics weights and a longer ramp.
scenario:
  ny: 96
  aspect_range: [0.5, 1.0]
  h_hat_logrange: [0.3, 30.0]
  robin_prob: 0.7
  gamma_logrange: [0.1, 10.0]
  n_sources: [1, 5]
  gauss_prob: 0.25
  sigma_range: [0.04, 0.15]
  sigma_ratio: [0.4, 1.0]
  rect_half: [0.03, 0.15]
  rect_edge: 0.006
  rel_amp: [0.2, 1.0]
  base_amp: 200.0
  margin: 0.12
  states_per_board: 3
  source_off_prob: 0.15
  heterogeneous_prob: 0.75
  n_material_regions: [1, 5]
  material_k_logrange: [0.12, 8.0]
  material_h_logrange: [0.3, 3.0]
  material_rc_logrange: [0.001, 0.08]
  material_zero_rc_prob: 0.35
  material_half: [0.04, 0.18]
  material_source_aligned_prob: 0.70
  material_rotated_prob: 0.20
  material_ellipse_prob: 0.20
  independent_boundary_prob: 0.75
  boundary_side_factor: [0.25, 4.0]
  local_contact_prob: 0.55
  local_contact_fraction: [0.08, 0.35]
  local_contact_factor: [2.0, 20.0]

train:
  n_train: 1024
  n_val: 128
  epochs: 30
  batch_size: 4
  lr: 1.2e-4
  weight_decay: 1.0e-5
  k_min: 3
  k_max: 16
  target_k: 3
  target_k_prob: 0.55
  n_query: 320
  n_colloc: 128
  n_boundary: 48
  n_interface: 12
  material_dropout: 0.15
  colloc_margin: 0.02
  lambda_pde_max: 3.0e-4
  lambda_boundary_max: 5.0e-5
  lambda_interface_max: 1.0e-4
  pde_warmup_epochs: 5
  pde_ramp_epochs: 25
  layout_prob: 0.15
  noise_theta_max: 0.10
  board_aspect_frac: 0.25
  k_min_ctx: 2
  context_dropout: 0.10
  cond_dropout: 0.50
  n_context: [64, 192]
  context_two_frames_prob: 0.5
  context_self_prob: 0.2
  val_context_weight: 0.85
  seed: 53

model:
  d_model: 128
  n_heads: 4
  n_self: 2
  n_cross: 3
  n_fourier: 32
  fourier_sigma: 5.0
  cond_dim: 4
  material_dim: 10
  material_hidden: 64
  boundary_dim: 8
  boundary_hidden: 48
